/* ========= 引擎 ========= */
var idx=0,answers=[];
function $(id){return document.getElementById(id)}
function show(p){["pHome","pQuiz","pResult"].forEach(function(x){$(x).classList.add("hide")});$(p).classList.remove("hide")}
function start(){idx=0;answers=[];show("pQuiz");render()}
function render(){
  var q=Q[idx];
  $("qNum").textContent="第 "+(idx+1)+" / "+Q.length+" 题";
  $("qBar").style.width=Math.round((idx+1)/Q.length*100)+"%";
  $("qText").textContent=q.t;
  var h="";
  q.o.forEach(function(o,i){h+='<button class="opt" onclick="pick('+i+')">'+o.x+"</button>"});
  $("qOpts").innerHTML=h;
}
function pick(i){
  answers.push(i);
  idx++;
  if(idx>=Q.length){result()}else{render()}
}
function calcUser(){
  var user={A:0,B:0,C:0,D:0,E:0,F:0,G:0,H:0};
  answers.forEach(function(ai,qi){
    Q[qi].o[ai].d.forEach(function(m){user[m[0]]+=m[1]});
  });
  /* 归一化到城市向量同一量纲（-2~2），避免题量变大后适配度触底 */
  var keys="ABCDEFGH".split(""),mx=1;
  keys.forEach(function(k){mx=Math.max(mx,Math.abs(user[k]))});
  var su={};
  keys.forEach(function(k){su[k]=user[k]/mx*2});
  return {raw:user,su:su};
}
function dist(su,c){
  var d=0;"ABCDEFGH".split("").forEach(function(k,i){d+=Math.abs(su[k]-c.v[i])});
  return d;
}
function result(){
  var u=calcUser(),user=u.raw,su=u.su;
  var ranked=CITIES.map(function(c){return {c:c,d:dist(su,c)}}).sort(function(a,b){return a.d-b.d});
  var top=ranked[0],alt=ranked[1],alt2=ranked[2],bad=ranked[ranked.length-1];
  var fit=Math.max(58,Math.min(98,Math.round(100-top.d*2.8)));
  $("heroBg").style.background="linear-gradient(160deg,"+top.c.g+","+top.c.g2+")";
  $("rScene").innerHTML=ART[CITIES.indexOf(top.c)];
  $("rCity").textContent=top.c.n;
  $("rTag").textContent=top.c.tag;
  $("rFit").textContent=fit+"%";
  var wh="";top.c.why.forEach(function(x){wh+='<div class="sym">'+x+"</div>"});$("rWhy").innerHTML=wh;
  var dd="";
  ["早上","下午","晚上"].forEach(function(t,i){dd+='<div class="day"><div class="t">'+t+'</div><div class="d">'+top.c.day[i]+"</div></div>"});
  $("rDay").innerHTML=dd;
  var ff="";top.c.food.forEach(function(x){ff+="<span>"+x+"</span>"});$("rFood").innerHTML=ff;
  $("rCost").textContent="【"+top.c.n+"物价印象】"+top.c.cost;
  $("rAlt").textContent=alt.c.n+" · "+alt.c.tag;
  $("rAltNote").textContent="和"+top.c.n+"气质相近，可作第二站考察。";
  $("rAlt2").textContent=alt2.c.n+" · "+alt2.c.tag;
  $("rAlt2Note").textContent="换个口味也不错，适合双城旅居。";
  $("rWarn").textContent="【最不适配】"+bad.c.n+"——"+warnLine(bad.c,su)+"";
  $("scName").textContent="退休去 "+top.c.n;
  $("scLine").textContent="“"+top.c.tag+"”";
  $("scFit").textContent="生活方式适配度 "+fit+"% · 备选 "+alt.c.n;
  window._shareText="测了24道题，我的退休本命城市是"+top.c.n+"，适配度"+fit+"%，"+top.c.tag+" 你退休去哪？";
  show("pResult");
  window.scrollTo(0,0);
}
function warnLine(c,su){
  /* 根据用户向量和城市最冲突的维度，生成个性化慎入理由 */
  var msgs={A:[c.v[0]>0?"你不是海派，看三天海就腻了":"你在内陆活得很滋润，去了水边反而不适应"],
            B:[c.v[1]>0?"它的热闹会把你吵到失眠":"它的安静会把你闷到数落叶"],
            C:[c.v[2]>0?"物价和房租会掏空你的退休金":"配套不够成熟，看病要出城"],
            D:[c.v[3]>0?"它的温暖对你是桑拿":"它的冬天对你是渡劫"],
            E:[c.v[4]>0?"文艺浓度过高，你会水土不服":"你受不了全是麻将声的生活"],
            F:[c.v[5]>0?"城市太精致，你会觉得贵":"野趣太多，你会想念外卖"],
            G:[c.v[6]>0?"慢节奏会让你怀疑人生在原地打转":"快节奏让你退休了还得赶场"],
            H:[c.v[7]>0?"全城清淡口味，你会想念辣椒":"重口味全席，你的胃会第一个抗议"]};
  var worst=0,wd=-1;
  "ABCDEFGH".split("").forEach(function(k,i){
    var d=Math.abs(su[k]-c.v[i]);
    if(d>wd){wd=d;worst=i}
  });
  return msgs["ABCDEFGH"[worst]][0];
}
function shareIt(){
  var t=window._shareText||"退休城市匹配";
  if(navigator&&navigator.share){navigator.share({title:"退休城市匹配",text:t}).catch(function(){});}
  else{alert("长按复制：\n\n"+t);}
}
